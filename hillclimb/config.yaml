# hillclimb workspace config (also the workspace marker, found by upward
# search). Precedence: CLI flags > this file > ~/.config/hillclimb/config.yaml
# > built-in defaults.
#
# This repo predates the hillclimb/ folder convention, so runs/ and problems/
# stay at the repo root via the overrides below. New workspaces created with
# `hillclimb init` keep everything under hillclimb/.
paths:
  runs_dir: runs
  problems_dir: problems

emflow:
  source: "-e ../emflow"  # local checkout; drop for the PyPI/git default
