# Three search strategies, one problem, one shared executable seed: only the
# optimizer varies. Sequential + learning off so no arm inherits knowledge
# from an earlier one. The first arm (greedy) is the control.
name: gepa-vs-openevolve-vs-greedy
problems: [circle-packing]
seed_from: seeds/circle-packing.py
repeats: 3
budget: 15m
schedule: sequential
noise_floor: 0.01

defaults:
  backend: claude-code
  model: sonnet
  learning.enabled: false
  search.parallel_operators: 1
  search.n_trials: 1

arms:
  greedy:
    search.policy: greedy
    search.policy_params: {}

  openevolve:
    search.policy: openevolve
    search.policy_params:
      random_seed: 42

  gepa:
    search.policy: gepa
    search.policy_params:
      max_metric_calls: 100
      candidate_selection_strategy: pareto
      frontier_type: instance
      cache_evaluation: true
      use_merge: false
      seed: 42
