# Which setup climbs circle-packing best? `hillclimb experiment run policy-vs-memory`
# (add --dry-run to see the jobs). The first experiment is the control; every other
# experiment is compared against it, paired by repeat, judged against noise_floor
# (measure it with `hillclimb verify circle-packing --repeat 5`).
problems: [circle-packing]
repeats: 2
budget: 15m
schedule: sequential   # memory experiments share the knowledge graph: keep them in lockstep
noise_floor: 0.01
experiments:
  greedy:       {climber: greedy}
  greedy-nomem: {climber: greedy, learning.enabled: false}
  openevolve:   {climber: openevolve}
