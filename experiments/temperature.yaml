# Sampling study: equal model, seed solution, prompts, policy and budget.
# Requires OPENROUTER_API_KEY in the environment or beside config.yaml in .env.
# Verify the floor on your machine before running:
#   hillclimb verify circle-packing --solution hillclimb/experiments/seeds/circle-packing.py --repeat 5
# Measured 2026-09-16: five scores of 2.158; spread 0, MAD 0.
# This is verifier noise for this deterministic seed, not search variance;
# three paired repeats provide an initial estimate of the latter.
# Run:    hillclimb experiment run temperature
# Report: hillclimb experiment report temperature --json
# Compare each treatment's verdict against t0.2 (the control).
problems: [circle-packing]
seed_from: seeds/circle-packing.py
repeats: 3
budget: 15m
noise_floor: 0.0
schedule: parallel
max_concurrent: 3
defaults:
  backend: pi
  backend_auth: openrouter
  model: openrouter/deepseek/deepseek-v3.2
  learning.enabled: false
  climber: climbers/greedy/policy.py
  climber.params: {tune_budget: 0}
  concurrency.parallel_agents: 1
  evaluation.n_replicates: 1
  budget.max_cost_usd: 2.0
experiments:
  t0.2:
    routing:
      default: {sampling: {temperature: 0.2}}
  t0.7:
    routing:
      default: {sampling: {temperature: 0.7}}
  t1.0:
    routing:
      default: {sampling: {temperature: 1.0}}
