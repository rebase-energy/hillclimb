# Three search strategies, one problem, one shared executable seed: only the
# optimizer varies. Sequential + learning off so no experiment inherits knowledge
# from an earlier one. The first experiment (greedy) is the control.
name: gepa-vs-openevolve-vs-greedy
problems: [circle-packing]
seed_from: seeds/circle-packing.py
repeats: 3
budget: 15m
schedule: sequential
noise_floor: 0.01

defaults:
  backend: claude-code
  model: sonnet
  learning.enabled: false
  concurrency.parallel_agents: 1
  evaluation.n_replicates: 1

experiments:
  greedy:
    climber: greedy
    climber.params: {}

  openevolve:
    climber: openevolve
    climber.params:
      random_seed: 42

  gepa:
    climber: gepa
    climber.params:
      # counted per instance (26 for circle-packing): 500 ~= 19 full
      # evaluations, so the 15m wall clock binds first, not this ceiling
      max_metric_calls: 500
      candidate_selection_strategy: pareto
      frontier_type: instance
      cache_evaluation: true
      use_merge: false
      seed: 42
