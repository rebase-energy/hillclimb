# Three search strategies across the Heilbronn difficulty ladder (11, 14, 17
# points), one shared executable seed: only the optimizer varies. Learning
# off so no experiment inherits knowledge from another. The first experiment (greedy) is
# the control. Bounded parallel: 8 searches alive at once, well under the
# machine's agent slots, so no search burns its clock in waiting-slot.
#
# Pilot first:  hillclimb experiment run gepa-vs-openevolve-vs-greedy-heilbronn --repeats 1
# Then repeats: hillclimb experiment run gepa-vs-openevolve-vs-greedy-heilbronn \
#                 --run-id <pilot-run-id> --first-repeat 2 --repeats 2
name: gepa-vs-openevolve-vs-greedy-heilbronn
problems: [heilbronn-11, heilbronn-14, heilbronn-17]
seed_from: seeds/heilbronn.py
repeats: 3
budget: 15m
schedule: parallel
max_concurrent: 8
# the scorer is deterministic, so this is agent variance: ~5% of the best
# known value per level, to be revisited against the pilot's spread
noise_floor:
  heilbronn-11: 0.002
  heilbronn-14: 0.0012
  heilbronn-17: 0.0008

defaults:
  backend: claude-code
  model: claude-opus-5
  learning.enabled: false
  concurrency.parallel_agents: 1
  evaluation.n_replicates: 1

experiments:
  greedy:
    climber: greedy
    climber.params: {}

  openevolve:
    climber: openevolve
    climber.selector_params:
      random_seed: 42

  gepa:
    climber: gepa
    climber.params:
      # the heilbronn scorer emits no per-instance breakdown, so the
      # instance frontier degenerates to the aggregate score and metric
      # calls count per search: 60 is far beyond what a 15m clock allows,
      # the wall clock binds first
      max_metric_calls: 60
      candidate_selection_strategy: pareto
      frontier_type: instance
      cache_evaluation: true
      use_merge: false
      seed: 42
