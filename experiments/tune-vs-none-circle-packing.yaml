# Does policy-driven parameter tuning beat plain greedy at equal wall clock?
# The control experiment keeps tune_budget at 0 (no tune jobs); the treatment experiment
# lets the greedy policy spend up to 8 extra trials per promising candidate,
# sampled by Optuna. Both experiments see the same prompt cue, so the agents may
# declare params.json either way — only the engine's spending differs.
problems: [circle-packing]
seed_from: seeds/circle-packing.py
repeats: 3
budget: 60m
noise_floor: 0.01
schedule: parallel
max_concurrent: 2
defaults:
  learning.enabled: false
  concurrency.parallel_agents: 1
  # agents write ~7 min solvers here; one draft, then tune it, is the only
  # schedule that reaches tune jobs inside an hour (a 30m pilot with the
  # default three drafts never got there)
  climber.params.num_drafts: 1
  climber.tuner: optuna
experiments:
  no-tune:
    climber.params.tune_budget: 0
  tune-8:
    climber.params.tune_budget: 8
