name: quickstart
# The website quickstart on every OS: install the wheel with plain pip, as a
# user would, then walk the steps with the dummy agent (no login, no tokens).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quickstart:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Build the wheel
        run: uv build --wheel
      - name: pip install hillclimb
        run: python -m pip install dist/*.whl pytest
      - name: The sandbox's own tool (Linux)
        if: runner.os == 'Linux'
        # what a Linux user installs once; Ubuntu 24.04 keeps unprivileged
        # user namespaces, which bubblewrap is built on, behind AppArmor
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: OS layer tests
        run: python -m pytest -q -p no:cacheprovider tests/test_oscompat.py
      - name: Sandbox tests
        # they start a real sandbox on Linux and macOS; Windows has none
        run: python -m pytest -q -p no:cacheprovider -rs tests/test_sandbox.py
      - name: Walk the quickstart
        run: |
          mkdir "$RUNNER_TEMP/qs" && cd "$RUNNER_TEMP/qs"
          bash "$GITHUB_WORKSPACE/scripts/quickstart-smoke.sh"
