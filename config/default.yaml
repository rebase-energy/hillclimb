backend: claude-code
model: sonnet

budget:
  total_s: 7200          # wall-clock budget for a run
  agent_timeout_s: 1800  # max seconds per operator (agent) call
  exec_timeout_s: 1800   # max seconds per solution.py execution
  stop_margin_s: 300     # stop the loop when less than this remains

search:
  num_drafts: 3
  max_debug_depth: 3
  parallel_agents: 1      # >1 enables the worker pool (concurrent operators)
  n_trials: 1             # validation evals per candidate; mean val is the climbing score
  machine_max_agents: 0   # machine-wide concurrent-agent cap across searches; 0 = off

holdout:
  enabled: true
  fraction: 0.1
  seed: 42
  climb_on: val          # documented seam; only 'val' implemented
  selection: rank-blend  # rank-blend | holdout | val — how the shipped submission is picked
  top_k: 5               # holdout scored only for top-k-by-val candidates (hygiene); 0 = all

ensemble:
  enabled: true
  reserve_fraction: 0.2  # last 20% of budget: try combining top candidates
  top_k: 3
  max_attempts: 2

paths:
  runs_dir: runs
  problems_dir: problems
  runtime_python: .runtime-venv/bin/python
  emflow_runtime_python: .runtime-venv-emflow/bin/python
  mlebench_python: ../mle-bench/.venv/bin/python
  mlebench_data_dir: null   # null = mlebench's default cache dir
  kaggle_bin: ../mle-bench/.venv/bin/kaggle  # for `hillclimb submit` (late submissions)

emflow:
  source: -e ../emflow  # local checkout; published installs use the git URL default
