[project]
name = "hillclimb"
version = "0.4.0"
description = "Auto-hillclimbing CLI for ML engineering tasks: deterministic greedy search over agent-drafted solutions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    # `hillclimb demo` must work from a bare `pip install hillclimb`: the
    # TUIs (watch/chart/graph) and the venv builder are core, not extras.
    "uv>=0.5",
    "textual>=1.0",
    "pydot>=4.0.1",
    "networkx>=3.0",
    "plotui>=0.2",
    # Windows has no `ps`/`os.kill(pid, 0)`: process listing and liveness go through psutil there
    "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
# kept so `pip install 'hillclimb[tui]'` keeps working; everything is core now
tui = []
emflow = [
    "emflow>=0.3.1,<0.4",
]
# `search.policy: openevolve` — MAP-Elites / islands search strategy
openevolve = [
    "openevolve>=0.3,<0.4",
]
# `search.policy: gepa` — reflective Pareto search engine
gepa = [
    "gepa>=0.1.4,<0.2",
    "optuna>=3.6,<5",
]
# `search.tuner: optuna` — TPE over a candidate's declared params.json
optuna = [
    "optuna>=3.6,<5",
]

[project.scripts]
hillclimb = "hillclimb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "textual>=1.0",
    "pydot>=4.0.1",
    "networkx>=3.0",
    "plotui>=0.2",
    "emflow",
    "openevolve>=0.3,<0.4",
    "gepa>=0.1.4,<0.2",
    "optuna>=3.6,<5",
]

[tool.uv.sources]
# Use emflow main while developing hillclimb from source. Published hillclimb
# artifacts resolve the compatible emflow release from PyPI via the extra above.
# Co-developing emflow? Re-add the editable checkout: uv pip install -e ../emflow
emflow = { git = "https://github.com/rebase-energy/emflow.git", branch = "main" }
# maturin backend: uv builds the Rust crate on sync (needs a Rust toolchain).
# After editing plotui's Rust source: uv sync --reinstall-package plotui
plotui = { path = "../plotui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hillclimb"]
artifacts = ["src/hillclimb/backends/pi_ext/*.ts"]

[tool.hatch.build.targets.sdist]
only-include = ["src/hillclimb", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests", "optuna: needs the optuna extra"]
