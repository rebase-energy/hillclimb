[project]
name = "hillclimb"
version = "0.8.0"
description = "Hillclimbing on verifiable rewards: coding agents search for Python programs that optimize a score you define"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rebasian Technologies AB" }]
keywords = [
    "hillclimbing",
    "verifiable-rewards",
    "coding-agents",
    "claude-code",
    "codex",
    "program-search",
    "optimization",
    "evolutionary-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    # A first run must work from a bare `pip install hillclimb`: the
    # TUIs (watch/chart/graph) and the venv builder are core, not extras.
    "uv>=0.5",
    "textual>=1.0",
    "pydot>=4.0.1",
    "networkx>=3.0",
    "plotui>=0.6",
    # Windows has no `ps`/`os.kill(pid, 0)`: process listing and liveness go through psutil there
    "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
# kept so `pip install 'hillclimb[tui]'` keeps working; everything is core now
tui = []
emflow = [
    "emflow>=0.3.1,<0.4",
]
# `selector_policy: map-elites` (the `openevolve` climber) — OpenEvolve's MAP-Elites database
openevolve = [
    "openevolve>=0.3,<0.4",
]
# `climber: gepa` — reflective Pareto search loop
gepa = [
    "gepa>=0.1.4,<0.2",
    "optuna>=3.6,<5",
]
# `climber.tuner: optuna` — TPE over a candidate's declared params.json
optuna = [
    "optuna>=3.6,<5",
]

[project.urls]
Homepage = "https://hillclimb.sh"
Documentation = "https://docs.hillclimb.sh"
Repository = "https://github.com/rebase-energy/hillclimb"
Changelog = "https://github.com/rebase-energy/hillclimb/blob/main/CHANGELOG.md"
Issues = "https://github.com/rebase-energy/hillclimb/issues"
Discord = "https://discord.gg/DDKh9UtSH"

[project.scripts]
hillclimb = "hillclimb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "textual>=1.0",
    "pydot>=4.0.1",
    "networkx>=3.0",
    "plotui>=0.6",
    "emflow",
    "openevolve>=0.3,<0.4",
    "gepa>=0.1.4,<0.2",
    "optuna>=3.6,<5",
    "matplotlib>=3.11.2",
]

[tool.uv.sources]
# Use emflow main while developing hillclimb from source. Published hillclimb
# artifacts resolve the compatible emflow release from PyPI via the extra above.
# Co-developing emflow? Re-add the editable checkout: uv pip install -e ../emflow
emflow = { git = "https://github.com/rebase-energy/emflow.git", branch = "main" }
# plotui comes from PyPI, so a fresh clone syncs without a sibling checkout.
# Co-developing plotui? uv pip install -e ../plotui, then run with UV_NO_SYNC=1
# (a plain `uv run` would sync the PyPI wheel back); see CONTRIBUTING.md.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hillclimb"]
artifacts = ["src/hillclimb/agents/pi_ext/*.ts"]

# the catalog (problems/, climbers/ beside src/) rides in the wheel as package
# data under hillclimb/_catalog/ — see hatch_build.py
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/hillclimb", "problems", "climbers", "hatch_build.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests", "optuna: needs the optuna extra"]
