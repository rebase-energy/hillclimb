[project]
name = "hillclimb"
version = "0.2.0"
description = "Auto-hillclimbing CLI for ML engineering tasks: deterministic greedy search over agent-drafted solutions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
tui = [
    "textual>=1.0",
    "pydot>=4.0.1",
]
emflow = [
    "emflow>=0.3,<0.4",
]

[project.scripts]
hillclimb = "hillclimb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "textual>=1.0",
    "pydot>=4.0.1",
    "emflow",
]

[tool.uv.sources]
emflow = { path = "../emflow", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hillclimb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests"]
