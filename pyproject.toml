[project]
name = "hillclimb"
version = "0.2.0"
description = "Auto-hillclimbing CLI for ML engineering tasks: deterministic greedy search over agent-drafted solutions"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
tui = [
    "textual>=1.0",
    "pydot>=4.0.1",
    "networkx>=3.0",
    "plotui>=0.2",
]
emflow = [
    "emflow>=0.3.1,<0.4",
]

[project.scripts]
hillclimb = "hillclimb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "textual>=1.0",
    "pydot>=4.0.1",
    "networkx>=3.0",
    "plotui>=0.2",
    "emflow",
]

[tool.uv.sources]
# Use emflow main while developing hillclimb from source. Published hillclimb
# artifacts resolve the compatible emflow release from PyPI via the extra above.
# Co-developing emflow? Re-add the editable checkout: uv pip install -e ../emflow
emflow = { git = "https://github.com/rebase-energy/emflow.git", branch = "main" }
# maturin backend: uv builds the Rust crate on sync (needs a Rust toolchain).
# After editing plotui's Rust source: uv sync --reinstall-package plotui
plotui = { path = "../plotui", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hillclimb"]

[tool.hatch.build.targets.sdist]
only-include = ["src/hillclimb", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration tests"]
