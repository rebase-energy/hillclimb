# Kaggle community competition (finished; late submissions open).
# Official metric shown as NRMSE; exact normalizer unverified (JS-rendered
# eval page) — on the fixed test set any normalizer is a constant, so
# climbing and selection behave identically to RMSE.
comp_id: dutch-energy-supplier-load-forecasting-challenge
metric: nrmse
higher_is_better: false
data_dir: data/dutch-energy-supplier-load-forecasting-challenge
allow_network: true   # comp rules require Open-Meteo weather; target lags forbidden
holdout:
  strategy: time-tail
  time_col: timestamp_utc
  id_col: timestamp_utc
  target_cols: [net_load_kwh]
  fraction: 0.1   # ~11.5 trailing days of a 116-day train; test horizon is 24d
